name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıkları kur
        run: npm install

      - name: Mantık testleri
        run: npm test

      - name: Web uygulamasını derle
        run: npm run build

      - name: Android projesini oluştur (yoksa)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          cp android-config/google-services.json android/app/google-services.json

      - name: Capacitor eşitle
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: gezi-hesabi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
